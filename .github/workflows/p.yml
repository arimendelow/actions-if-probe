name: probe
on: [push, workflow_dispatch]
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.t.outputs.tree }}
      installs: ${{ steps.i.outputs.installs }}
    steps:
      - id: t
        run: echo "tree=abc" >> "$GITHUB_OUTPUT"
      - id: i
        run: |
          for tier in installs heavy; do echo "$tier=here" >> "$GITHUB_OUTPUT"; done
  shard:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tree == 'nope' }}
    strategy:
      matrix:
        n: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - run: true
  agg:
    needs: [plan, shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: true
  a:
    needs: [plan, agg]
    if: ${{ !cancelled() && !contains(needs.*.result, 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ toJSON(needs) }}"
  b:
    needs: [plan, agg]
    if: ${{ !cancelled() && needs.plan.outputs.installs == 'here' }}
    runs-on: ubuntu-latest
    steps:
      - run: true
  c:
    needs: [plan, agg]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - run: true
  d:
    needs: [plan, agg]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo '${{ toJSON(needs) }}'
