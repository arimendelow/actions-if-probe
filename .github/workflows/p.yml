name: probe
on: [push, workflow_dispatch]
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.t.outputs.tree }}
      installs: ${{ steps.i.outputs.installs }}
    steps:
      - id: t
        run: echo "tree=abc" >> "$GITHUB_OUTPUT"
      - id: i
        run: |
          for tier in installs heavy; do echo "$tier=here" >> "$GITHUB_OUTPUT"; done
  shard:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tree == 'nope' }}
    strategy:
      matrix:
        n: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - run: true
  agg:
    needs: [plan, shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: true
  a1:
    needs: [plan, agg]
    if: ${{ !cancelled() && !contains(needs.*.result, 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo '${{ toJSON(needs.*.result) }}'
  a2:
    needs: [plan, agg]
    if: ${{ !contains(needs.*.result, 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo '${{ toJSON(needs.*.result) }}'
  a3:
    needs: [plan, agg]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo '${{ toJSON(needs.*.result) }}'
  a4:
    needs: [plan, agg]
    if: ${{ !cancelled() && needs.agg.result == 'success' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo '${{ toJSON(needs.*.result) }}'
  a5:
    needs: [plan, agg]
    if: ${{ !cancelled() && !contains(join(needs.*.result, ','), 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo '${{ toJSON(needs.*.result) }}'
  a6:
    needs: [plan, agg]
    if: ${{ always() && !contains(needs.*.result, 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo '${{ toJSON(needs.*.result) }}'
